# Midweek Merchant configuration. Environment variables override:
#   FPL_TEAM_ID, FPL_LEAGUE_ID, ODDS_API_KEY, MM_DATA_DIR
season: "2026-27"
team_id: 3649661     # in6months (number in the URL of your points page)
league_id: 1122026   # Mabingwa wa Signvrse (classic mini-league id)

history_seasons: ["2023-24", "2024-25", "2025-26"]

forecast:
  horizon: 8                 # gameweeks to project
  # Team strength: tuned by `mm diagnose team-strength` on 2024-25 and 2025-26, point-in-time over
  # a 6-GW horizon without odds for the forecast fixtures (deviance on goals 1.082 -> 1.062; the
  # market's own opening odds score 1.061 on the same fixtures).
  team_decay_per_day: 0.02   # time decay (half-life ~ 35 days): the market targets carry the history
  xg_weight: 0.6             # weight of xG vs goals in team-strength targets
  market_target_weight: 0.6  # weight of past matches' opening-odds λ in the targets
  ridge: 2.0                 # L2 penalty on team attack/defence ratings
  team_spread: 1.0           # scale on team differences (1.0 = none needed after tuning)
  market_weight_next: 0.9    # weight on odds-implied lambdas for the next GW
  market_weight_decay: 0.6   # multiplicative decay of market weight per GW further out
  player_half_life_matches: 12
  prior_matches: 5           # empirical-Bayes prior strength (full matches); tuned by backtest
  # Unforeseen absences: backtests forecasting 2-6 weeks ahead over-predicted total points by
  # 4-10% (2025/26) and 2-3% (2026/27 so far), growing with the horizon: injuries, bans and drops
  # pile up. ~2.2%/week fits 2025/26, ~1.2% this season; 1.5% splits them.
  attrition_per_gw: 0.015
  n_sims: 3000
  # Minutes calibration: monotone maps from the minutes model's raw start / 60-minute rates to
  # what happened, fitted on point-in-time 2025/26 backtests (`mm diagnose minutes`); validated on
  # 2026/27 (Brier 0.1062 -> 0.1052 for 60+ minutes). Empty = no calibration.
  minutes_calibration:
    start: [[0.0, 0.0], [0.0189, 0.018], [0.0696, 0.1082], [0.1494, 0.2013], [0.2524, 0.3069], [0.3527, 0.3435], [0.4499, 0.4467], [0.5524, 0.5308], [0.6507, 0.5871], [0.7252, 0.7622], [0.7746, 0.8282], [0.8258, 0.8636], [0.8743, 0.8907], [0.9176, 0.9287], [0.9509, 0.9391]]
    q60: [[0.0, 0.0], [0.6509, 0.7965], [0.7846, 0.8699], [0.8279, 0.9155], [0.8781, 0.9155], [0.9172, 0.9329], [0.9477, 0.9409], [0.9647, 0.9684]]

optimizer:
  horizon: 6
  decay: 0.85
  bench_weights: [0.03, 0.21, 0.06, 0.002]   # GK bench, then outfield bench 1..3
  vice_weight: 0.05
  ft_values: {1: 1.5, 2: 2.0, 3: 1.6, 4: 1.3, 5: 1.1}
  itb_value: 0.08
  transfer_penalty: 0.05     # small penalty per transfer to avoid churn
  hit_cost: 4
  max_hits_per_gw: 2
  pool_size: 220
  mip_gap: 0.008             # relative MIP gap (same plans as 0.003 in testing, ~4x faster)
  time_limit: 45
  ft_after_chip: freeze      # freeze | accrue: FTs after WC/FH weeks (freeze verified: mm diagnose ft-rule)
  chip_option_value: {wildcard: 6.0, freehit: 5.0, bboost: 5.0, "3xc": 3.0}

odds:
  min_hours_between_calls: 12
  regions: uk
  markets: h2h,totals
