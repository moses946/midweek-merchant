# Render blueprint: the dashboard (static site) and the live-planner API, both on the free plan.
# New -> Blueprint -> pick this repository. The dashboard bakes in the published data at build
# time and reads the fresh bundle from the `data` branch at runtime.
services:
  - type: web
    name: midweek-merchant
    runtime: static
    buildCommand: >-
      pip install uv && uv sync --frozen && uv run mm sync &&
      uv run mm export-web --out web/public/data && cd web && npm ci && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_URL
        value: https://midweek-merchant-api.onrender.com
      - key: VITE_SITE_URL
        value: https://midweek-merchant.onrender.com/

  - type: web
    name: midweek-merchant-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install uv && uv sync --frozen --extra api
    startCommand: uv run --frozen --extra api uvicorn midweek_merchant.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MM_CORS_ORIGINS
        value: https://midweek-merchant.onrender.com,https://moses946.github.io
      - key: MM_MAX_SOLVES
        value: "1"
