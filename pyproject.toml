[project]
name = "midweek-merchant"
version = "0.1.0"
description = "FPL expected-points forecaster, squad optimiser and mini-league strategist"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "pyarrow>=15",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6",
    "typer>=0.12",
    "highspy>=1.11",
    "streamlit>=1.38",
    "plotly>=5.20",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.3"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
mm = "midweek_merchant.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midweek_merchant"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: tests that hit live APIs (deselect with -m 'not network')"]
